[package]
name = "marginalia"
version = "0.2.0"
edition = "2024"
description = "Review agent-proposed Markdown changes and keep recoverable versions."
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
