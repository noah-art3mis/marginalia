[project]
name = "marginalia-cli"
version = "0.1.0"
description = "Review agent-proposed Markdown changes and keep recoverable versions."
requires-python = ">=3.12"
dependencies = ["typer>=0.16", "rich>=14", "pydantic>=2.11"]

[project.scripts]
marginalia = "marginalia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marginalia"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
